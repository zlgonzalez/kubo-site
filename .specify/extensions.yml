installed:
- blueprint-index
- speckit-implement
- speckit-plan
- speckit-specify
settings:
  auto_execute_hooks: false
hooks:
  before_implement:
  - extension: speckit-implement
    command: speckit.speckit-implement.before
    enabled: true
    optional: false
    priority: 10
    prompt: Generate integration tests from the spec before implementation?
    description: Generate integration tests from the feature spec before implementation
    condition: null
  after_implement:
  - extension: speckit-implement
    command: speckit.speckit-implement.after
    enabled: false
    optional: true
    priority: 10
    prompt: Run after_implement hook?
    description: After /speckit.implement hook
    condition: null
  before_plan:
  - extension: speckit-plan
    command: speckit.speckit-plan.before
    enabled: true
    optional: true
    priority: 10
    prompt: Run before_plan hook?
    description: Before /speckit.plan hook
    condition: null
  after_plan:
  - extension: speckit-plan
    command: speckit.speckit-plan.after
    enabled: false
    optional: true
    priority: 10
    prompt: Run after_plan hook?
    description: After /speckit.plan hook
    condition: null
  before_specify:
  - extension: speckit-specify
    command: speckit.speckit-specify.before
    enabled: false
    optional: true
    priority: 10
    prompt: Run before_specify hook?
    description: Before /speckit.specify hook
    condition: null
  after_specify:
  - extension: speckit-specify
    command: speckit.speckit-specify.after
    enabled: false
    optional: true
    priority: 10
    prompt: Run after_specify hook?
    description: After /speckit.specify hook
    condition: null
